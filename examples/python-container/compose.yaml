name: drillip-python

services:
  app:
    build:
      context: .
      args:
        DRILLIP_IMAGE: ${DRILLIP_IMAGE:-ghcr.io/philhem/drillip:v0.3.16}
    platform: linux/amd64
    ports:
      - "127.0.0.1:${APP_PORT:-18000}:8000"
    volumes:
      - drillip-data:/var/lib/drillip
    stop_grace_period: 40s

volumes:
  drillip-data:
