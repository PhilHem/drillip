name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  embedded-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build embedded Python example
        run: docker build --platform linux/amd64 -t drillip-python-example examples/python-container
      - name: Exercise capture and process lifecycle
        run: python3 examples/python-container/smoke_test.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -short ./... -count=1

      - name: Race detector
        run: go test -short -race ./... -count=1

      - name: Vet
        run: go vet ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check for known vulnerabilities
        run: govulncheck ./...
