name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  embedded-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        drillip: [released, checkout]
    env:
      DRILLIP_IMAGE: ${{ matrix.drillip == 'checkout' && 'drillip:ci' || 'ghcr.io/philhem/drillip:v0.3.14' }}
    steps:
      - uses: actions/checkout@v6
      - name: Build checkout image
        if: matrix.drillip == 'checkout'
        run: docker build -t drillip:ci .
      - name: Build embedded Python example
        run: docker build --platform linux/amd64 --build-arg DRILLIP_IMAGE="$DRILLIP_IMAGE" -t drillip-python-example examples/python-container
      - name: Exercise capture and process lifecycle
        run: python3 examples/python-container/smoke_test.py
      - name: Exercise Compose deployment
        run: python3 examples/python-container/compose_smoke_test.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -short ./... -count=1

      - name: Race detector
        run: go test -short -race ./... -count=1

      - name: Vet
        run: go vet ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check for known vulnerabilities
        run: govulncheck ./...
